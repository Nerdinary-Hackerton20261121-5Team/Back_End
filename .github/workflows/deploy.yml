# GitOps 자동 배포: main에 push(병합)되면 이미지를 만들어 운영자 Zot 레지스트리(registry.bemelon.me)에 올리고,
# cluster-config 레포의 이미지 태그를 갱신한다. 이후 Argo CD가 그 커밋을 감지해 클러스터에 반영한다.
#
#   main push → docker build (linux/amd64) → registry.bemelon.me/cmc-11th/back_end:<sha> push
#            → cluster-config deploy-image 호출 (app=be) → 커밋 "deploy(be): <image>"
#            → Argo CD 롤링 업데이트
#
# 필요한 것: 레포 secret ZOT_USERNAME·ZOT_PASSWORD (Zot 계정 cmc-11th-ci, cmc-11th/** 에만 push 가능),
#           CLUSTER_CONFIG_DEPLOY_KEY (secrets: inherit 로 전달, 이미 등록됨)
# 롤백: cluster-config 레포에서 해당 deploy(be) 커밋을 revert (README 참고)
name: Deploy

# dev 서버: dev push 도 같은 흐름으로 배포하고 cluster-config 의 apps/be-dev 를 갱신한다
#   main → app be     → https://cmc-11th.bemelon.me      (운영)
#   dev  → app be-dev → https://cmc-11th-dev.bemelon.me  (dev 서버, DB app_dev)
# 이미지 저장소는 같고(back_end) 태그 sha 로 구분한다. concurrency 는 ref 별이라 main·dev 배포는 서로 막지 않는다.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch는 브랜치를 고를 수 있으므로, main·dev가 아닌 ref는 배포하지 않는다.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "image=registry.bemelon.me/cmc-11th/back_end:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.bemelon.me
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # 홈서버 k3s가 amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: Nerdinary-Hackerton20261121-5Team/cluster-config/.github/workflows/deploy-image.yml@main
    with:
      # main → be (운영), dev → be-dev (dev 서버)
      app: ${{ github.ref == 'refs/heads/dev' && 'be-dev' || 'be' }}
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
