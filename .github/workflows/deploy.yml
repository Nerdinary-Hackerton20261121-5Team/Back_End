# 배포 워크플로 초안: main에 push(병합)되면 이미지를 만들어 EC2에 배포한다.
# AWS 리소스와 GitHub Secrets가 준비되기 전에는 check 단계에서 배포를 건너뛴다.
#
# 필요한 GitHub Secrets
#   EC2_HOST, EC2_USER, EC2_SSH_KEY            EC2 접속
#   DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD, DB_DATABASE   RDS 접속
#   CORS_ORIGIN                                허용할 프론트 주소
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST Secret이 없어 배포를 건너뜁니다."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,CORS_ORIGIN
          script: |
            set -e
            # 운영 환경변수 파일 (EC2에만 존재, 권한 600)
            umask 077
            cat > ~/app.env <<ENV
            PORT=3000
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            DB_DATABASE=$DB_DATABASE
            DB_LOGGING=false
            CORS_ORIGIN=$CORS_ORIGIN
            ENV

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            # 마이그레이션 적용 (data-source가 있는 경우에만)
            docker run --rm --env-file ~/app.env "$IMAGE" sh -c \
              'if [ -f dist/database/data-source.js ]; then node ./node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js; else echo "no data-source, skip migration"; fi'

            # 앱 교체. 3000은 EC2 내부(127.0.0.1)에만 열고, 외부는 Nginx(80/443)가 받는다.
            docker rm -f app 2>/dev/null || true
            docker run -d --name app --restart unless-stopped \
              --env-file ~/app.env -p 127.0.0.1:3000:3000 "$IMAGE"

            docker image prune -f
            docker logout ghcr.io
