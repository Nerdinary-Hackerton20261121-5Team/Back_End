# GitOps 자동 배포: main에 push(병합)되면 이미지를 만들어 ghcr에 올리고,
# cluster-config 레포의 이미지 태그를 갱신한다. 이후 Argo CD가 그 커밋을 감지해 클러스터에 반영한다.
#
#   main push → docker build (linux/amd64) → ghcr.io/<owner>/<repo>:<sha> push
#            → cluster-config deploy-image 호출 (app=be) → 커밋 "deploy(be): <image>"
#            → Argo CD 롤링 업데이트
#
# 필요한 것: 레포 secret CLUSTER_CONFIG_DEPLOY_KEY (secrets: inherit 로 전달, 이미 등록됨)
# 롤백: cluster-config 레포에서 해당 deploy(be) 커밋을 revert (README 참고)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch는 브랜치를 고를 수 있으므로, main이 아닌 ref는 배포하지 않는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # 홈서버 k3s가 amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: Nerdinary-Hackerton20261121-5Team/cluster-config/.github/workflows/deploy-image.yml@main
    with:
      app: be
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
